[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aergia-api"
version = "0.1.0"
description = "Aergia CV Builder API - Build professional CVs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20.0",
    "slowapi>=0.1.9",
    "PyJWT>=2.9.0",
    "cryptography>=50.0.0",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "pypdfium2>=4.30",
    "playwright>=1.48",
    "email-validator>=2.1",
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=0.6",
    "groq>=0.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
